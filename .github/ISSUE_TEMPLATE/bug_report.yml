name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you say or do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `anaya.log` or the console. Remove anything private.
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.14.3"
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Push-to-talk (default), Wake word]
  - type: input
    id: mic
    attributes:
      label: Microphone
      description: Built-in, headset, USB...
